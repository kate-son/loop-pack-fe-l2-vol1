name: E2E

# workflow 자체는 모든 PR에서 트리거한다. on.paths로 트리거를 막으면 required로 건 체크가
# 보고되지 않아 PR이 "체크 대기"에서 멈춘다. 실행 여부는 job 단위로 판정한다.
"on":
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # 스킵해도 되는 경로만 나열한다. 여기에 없는 변경은 전부 실행 대상이다.
      # 확장자로 문서를 판정하지 않는다 — docs/assets에는 테스트가 읽는 파일이 있고
      # docs/examples에는 tsx·css가 있다.
      - name: 변경 파일로 실행 여부 판정
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail

          # --slurp은 페이지별 배열을 배열의 배열로 돌려준다. Node에서 flat()으로 합친다.
          gh api "repos/$REPO/pulls/$PR/files" --paginate --slurp > pages.json

          cat > decide.cjs <<'EOF'
          const fs = require('fs');

          const pages = JSON.parse(fs.readFileSync('pages.json', 'utf8'));
          const files = pages.flat();
          const declared = Number(process.env.CHANGED);
          const emit = (run) =>
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);

          // 변경 수가 양의 정수가 아니면 판정 자체를 신뢰할 수 없다.
          if (!Number.isInteger(declared) || declared <= 0) {
            console.error(`변경 수가 비정상이다: ${process.env.CHANGED}`);
            process.exit(1);
          }

          // PR 파일 API는 최대 3,000개까지만 돌려준다.
          // 목록이 비었거나 선언된 수와 다르면 스킵하지 않는다.
          if (files.length === 0 || files.length !== declared) {
            console.log(`목록 불완전: 받은 ${files.length} / 선언 ${declared} — 실행한다`);
            emit(true);
            process.exit(0);
          }

          // 실행 결과에 영향을 주지 않는 것으로 확인한 문서 경로만 허용한다.
          const skippable = (p) =>
            p.startsWith('docs/rfc/') ||
            p.startsWith('docs/assignments/') ||
            p.startsWith('docs/images/') ||
            /^docs\/[^/]+\.md$/.test(p) ||
            p === 'README.md';

          // 이름 변경은 이전 경로까지 본다. 앱 파일을 문서 경로로 옮긴 변경을 스킵하지 않는다.
          const paths = files.flatMap((f) =>
            f.previous_filename ? [f.filename, f.previous_filename] : [f.filename],
          );

          const run = paths.some((p) => !skippable(p));
          paths.forEach((p) => console.log(`  ${skippable(p) ? 'skip' : 'RUN '} ${p}`));
          console.log(run ? '실행 대상 변경이 있다' : '문서 변경만 있다');
          emit(run);
          EOF

          node decide.cjs

  e2e:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 브라우저 설치는 E2E를 실제로 실행하는 이 job에만 둔다 (docs/rfc/week10-step01.md 1단계).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm test:e2e

      # 재시도로 통과한 테스트를 실행 요약에 남긴다. 리포트 없음과 flaky 0건을 구분한다.
      - name: 재시도로 통과한 테스트 기록
        if: always()
        run: |
          set -euo pipefail
          report=playwright-report/results.json

          if [ ! -f "$report" ]; then
            {
              echo '### E2E 리포트 미생성'
              echo '테스트 실행 전 단계(의존성 설치·브라우저 설치·서버 기동)에서 끝났을 수 있다.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > flaky.cjs <<'EOF'
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
          const flaky = [];

          const walk = (suite) => {
            (suite.specs || []).forEach((spec) => {
              (spec.tests || []).forEach((test) => {
                if (test.status === 'flaky') {
                  const retries = Math.max((test.results || []).length - 1, 0);
                  flaky.push(`- \`${spec.file || suite.file || ''}\` › ${spec.title} (재시도 ${retries}회)`);
                }
              });
            });
            (suite.suites || []).forEach(walk);
          };
          (report.suites || []).forEach(walk);

          const lines =
            flaky.length === 0
              ? ['### 재시도로 통과한 테스트 없음']
              : ['### 재시도로 통과한 테스트(flaky)', '', ...flaky];

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          EOF

          if ! node flaky.cjs; then
            echo '### flaky 리포트 처리 실패' >> "$GITHUB_STEP_SUMMARY"
            echo '리포트를 읽지 못했다. 아티팩트의 원본을 확인할 것.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # JSON 리포트에는 trace가 들어가지 않는다. Playwright 기본 산출물 경로를 함께 올린다.
      - name: 리포트 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # required로 거는 대상은 이 job이다. always()는 선행 job이 실패·스킵해도
  # 결과 판정을 시도하게 하는 설정이며, 정상 실행과 의도한 스킵만 성공으로 처리한다.
  e2e-required:
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 결과 판정
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TARGET: ${{ needs.changes.outputs.run }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "changes=$CHANGES_RESULT target=$RUN_TARGET e2e=$E2E_RESULT"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "경로 판정이 정상 종료하지 않았다: $CHANGES_RESULT"
            exit 1
          fi

          case "$RUN_TARGET" in
            false)
              if [ "$E2E_RESULT" != "skipped" ]; then
                echo "스킵 대상인데 e2e=$E2E_RESULT"
                exit 1
              fi
              echo "문서 변경만 — 의도한 스킵"
              ;;
            true)
              if [ "$E2E_RESULT" != "success" ]; then
                echo "e2e=$E2E_RESULT"
                exit 1
              fi
              echo "E2E 통과"
              ;;
            *)
              echo "판정 출력이 비었거나 예상 밖이다: '$RUN_TARGET'"
              exit 1
              ;;
          esac
