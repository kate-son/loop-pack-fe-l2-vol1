name: Quality

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 같은 PR에 연속 push가 들어오면 이전 실행을 취소한다. 팀에서 러너 풀을 나눠 쓸 때
# 끝난 커밋의 실행이 큐를 차지하지 않게 하려는 것이다.
# 그룹 키에 github.ref를 넣지 않으면 PR 실행 취소가 main push 실행까지 끌고 간다.
# cancel-in-progress를 PR로 한정해, main의 실행 중인 작업은 취소되지 않게 둔다.
# (같은 그룹에서 대기 중인 실행은 새 실행으로 교체될 수 있다.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # 멈춘 job이 러너를 무한히 잡고 있지 않도록 상한을 둔다.
    # 관측된 최장 실행 시간 114초보다 여유를 두어 상한을 10분으로 설정했다.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # chromium 설치 step을 제거했다. 이 job은 test/lint/typecheck/build만 돌리고
      # test:e2e를 부르지 않아 브라우저가 쓰이지 않는데, 설치가 가장 오래 걸리는 구간이었고
      # 외부 패키지 저장소 상태에 따라 검증 전체를 막기도 했다 (docs/rfc/week10-step01.md 0-5).
      # E2E 실행 환경과 그에 필요한 브라우저 설치는 E2E job을 만들 때 함께 둔다.
      #
      # pnpm check를 step으로 나눈 이유는 계측이다. 단일 step에서는 test/lint/typecheck/build 중
      # 어디가 긴지 로그에서 구분되지 않는다. 실행 순서와 검증 집합은 pnpm check와 같다.
      # 이 구성은 Before/After 측정 내내 동일하게 유지한다 (docs/rfc/week10-step01.md 0-1).
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
